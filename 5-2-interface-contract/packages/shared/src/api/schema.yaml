openapi: 3.1.0
info:
  title: 智能知识问答系统 API
  version: 1.0.0
  description: >
    AI 知识问答系统接口契约。用户上传文档、分知识库管理,基于文档内容提问,
    系统返回带依据标注(grounded)的回答,支持 SSE 流式输出与多轮对话。


    契约来源:doc/architecture-design.md「四、API 接口契约」+ CLAUDE.md 安全/行为约束
    + packages/shared/src/types(领域类型与 SSE 事件的单一事实源)。


    鉴权:除 register/login 外,所有接口需登录态。登录态由 Supabase Auth 的
    session 承载;本 schema 以 bearerAuth 抽象标注"需鉴权",不代表放弃 cookie 方案。

servers:
  - url: /

tags:
  - name: auth
    description: 认证(注册 / 登录)
  - name: knowledge-bases
    description: 知识库 CRUD(全员平权,无 owner 字段,不拼 user 过滤)
  - name: documents
    description: 文档全异步入库 + 状态轮询
  - name: chat
    description: SSE 流式问答(检索 + query rewriting + 生成 + 中断)
  - name: conversations
    description: 用户历史记录(强制拼 user_id 过滤)
  - name: admin
    description: 管理员审计(独立只读路径,刻意不拼 user_id 过滤)

security:
  - bearerAuth: []

paths:
  # ============ 第 0 层:认证 ============
  /api/auth/register:
    post:
      tags: [auth]
      summary: 注册账号
      description: >
        邮箱 + 密码注册,返回登录态与用户信息。注册开放度由 Supabase Auth 配置约束
        (限公司邮箱域名 / 邀请制,见架构待确认项 1),服务端强制校验。
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 邮箱已被注册
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/auth/login:
    post:
      tags: [auth]
      summary: 登录
      description: 邮箱 + 密码登录,签发 session。登录入口按 IP/账号限失败次数(CLAUDE.md 安全 P0)。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ============ 第 1 层:知识库 CRUD ============
  /api/knowledge-bases:
    get:
      tags: [knowledge-bases]
      summary: 列出全部知识库
      description: 知识库全员平权,返回全量,不拼 user 过滤(CLAUDE.md 数据边界)。
      operationId: listKnowledgeBases
      responses:
        "200":
          description: 知识库列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [knowledge-bases]
      summary: 创建知识库
      operationId: createKnowledgeBase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeBaseRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/knowledge-bases/{id}:
    delete:
      tags: [knowledge-bases]
      summary: 删除知识库
      description: 级联删除库内 documents 与 doc_chunks(ON DELETE CASCADE)。前端二次确认不构成后端防护。
      operationId: deleteKnowledgeBase
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 删除成功,返回级联影响量(供审计)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteKnowledgeBaseResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============ 第 2 层:文档管理 ============
  /api/knowledge-bases/{id}/documents:
    get:
      tags: [documents]
      summary: 列出库内文档及状态
      operationId: listDocuments
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 文档列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [documents]
      summary: 上传文档(全异步入库)
      description: >
        上传立即返回 { documentId, status: "pending" },解析/embedding/写库丢后台。
        文件字节暂存服务端本地临时目录,pg-boss 载荷只带文件路径引用。
      operationId: uploadDocument
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadDocumentRequest"
      responses:
        "202":
          description: 已接收,后台入库中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          description: 不支持的文件格式(仅 pdf/docx/txt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/documents/{id}:
    get:
      tags: [documents]
      summary: 轮询单份文档状态
      operationId: getDocument
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 文档状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [documents]
      summary: 删除文档及其 chunk
      operationId: deleteDocument
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: 删除成功,无响应体
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============ 第 3 层:流式问答 ============
  /api/chat:
    post:
      tags: [chat]
      summary: SSE 流式问答
      description: >
        RAG 流式问答:取会话上下文 → query rewriting → 向量检索 → LLM 流式生成。
        响应为 text/event-stream。首字节(HTTP 200)发出后的错误只能走 event: error
        在流内传递,不依赖 HTTP 状态码。前端 AbortController.abort() 透传取消上游 LLM fetch。


        SSE 事件序列:先 meta(grounded 命中状态)→ 多个 token(逐字追加)→ done(收束,回传 conversationId);
        流内异常走 error。每个事件按 `event:` 分派,`data:` 为对应 JSON。
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE 事件流。以下 schema 描述单个 SSE 事件的 data JSON。
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: sessionId 不归属当前 user_id(禁止读他人上下文)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ============ 第 4 层:历史记录 ============
  /api/conversations:
    get:
      tags: [conversations]
      summary: 列出当前用户的会话
      description: 数据访问层强制注入 WHERE user_id = :currentUser。大数据量走游标分页。
      operationId: listConversations
      parameters:
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: 会话分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/conversations/{id}/messages:
    get:
      tags: [conversations]
      summary: 查会话内消息
      description: 必须校验 :id 归属当前用户(防 IDOR)。
      operationId: listConversationMessages
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: 消息分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 会话不归属当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============ 第 5 层:管理后台 ============
  /api/admin/conversations:
    get:
      tags: [admin]
      summary: 全局只读查看所有用户的问答记录
      description: >
        管理员审计路径,刻意不拼 user_id 过滤,校验 role === 'admin'
        (不得用 role !== 'user' 反向逻辑)。此调用是全系统唯一必须审计到人的操作,
        服务端必带 admin_user_id + target_user_id 落审计。
      operationId: listAdminConversations
      parameters:
        - name: targetUserId
          in: query
          required: false
          description: 可选,按目标用户过滤;缺省时返回全体。
          schema:
            type: string
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: 全局会话分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        登录态。实际由 Supabase Auth 的 httpOnly session cookie 承载、服务端经
        supabase.auth.getUser() 校验;此处以 bearerAuth 统一抽象"需鉴权"语义。

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: 资源 ID(bigserial 序列化为字符串,避免 JS number 精度丢失)。
      schema:
        type: string
        pattern: "^[0-9]+$"
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: 游标分页锚点,取上一页 nextCursor;首页省略。
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      required: false
      description: 单页条数。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: 未登录或登录态失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: 已登录但无权访问(如非 admin 访问 /api/admin/*)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: 触发限流(认证入口按 IP/账号限失败次数)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    # ---------- 统一错误 ----------
    ApiError:
      type: object
      description: 全系统统一错误响应。绝不含 password_hash、密钥或 messages.content。
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: 机器可判读的错误码,如 LLM_TIMEOUT / UNAUTHORIZED / VALIDATION_ERROR。
              examples: ["VALIDATION_ERROR"]
            message:
              type: string
              description: 面向开发者的人类可读描述,不含敏感字段。
            details:
              type: object
              description: 可选的结构化补充(如逐字段校验错误)。
              additionalProperties: true

    # ---------- 枚举 ----------
    Role:
      type: string
      enum: [user, admin]
      description: 用户角色。admin 唯一特权是只读 /api/admin/*。
    DocumentStatus:
      type: string
      enum: [pending, processing, ready, failed]
      description: 文档全异步入库状态机,前端轮询此字段。
    IngestFailReason:
      type: string
      enum: [scanned_no_text, parse_error, unsupported_format]
      description: >
        入库失败原因。scanned_no_text=扫描件拦截(产品边界内正常拒绝);
        parse_error=解析失败(真异常);unsupported_format=格式不支持。
    DocumentFileType:
      type: string
      enum: [pdf, docx, txt]
      description: 支持的文档格式(pdf-parse / mammoth / fs)。
    MessageRole:
      type: string
      enum: [user, assistant]

    # ---------- 认证 ----------
    AuthCredentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    AuthResult:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: >
            兼容字段。Supabase Auth 下登录态走 session cookie,token 可能缺省;
            保留以兼容架构文档 API 表中的 { token } 契约。

    # ---------- 领域实体(与 packages/shared/src/types/domain.ts 对齐) ----------
    User:
      type: object
      description: 用户账号。password_hash 绝不出现在任何响应中。
      required: [id, email, role, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    KnowledgeBase:
      type: object
      description: 知识库,全员共享,无 owner 字段。
      required: [id, name, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateKnowledgeBaseRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    DeleteKnowledgeBaseResult:
      type: object
      description: 删除结果与级联影响量(供审计记录)。
      required: [id, deletedDocuments, deletedChunks]
      additionalProperties: false
      properties:
        id:
          type: string
        deletedDocuments:
          type: integer
          minimum: 0
        deletedChunks:
          type: integer
          minimum: 0

    DocumentMeta:
      type: object
      description: 文档元数据。失败时带 errorReason,不入库空内容。
      required: [id, knowledgeBaseId, fileName, fileType, status, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
        knowledgeBaseId:
          type: string
        fileName:
          type: string
        fileType:
          $ref: "#/components/schemas/DocumentFileType"
        status:
          $ref: "#/components/schemas/DocumentStatus"
        errorReason:
          $ref: "#/components/schemas/IngestFailReason"
        createdAt:
          type: string
          format: date-time
    UploadDocumentRequest:
      type: object
      required: [file]
      additionalProperties: false
      properties:
        file:
          type: string
          format: binary
          description: 文档文件(pdf/docx/txt)。
    UploadDocumentResult:
      type: object
      description: 上传即时返回,后台异步入库。
      required: [documentId, status]
      additionalProperties: false
      properties:
        documentId:
          type: string
        status:
          allOf:
            - $ref: "#/components/schemas/DocumentStatus"
          description: 上传即返回,固定为 pending。
          const: pending

    Conversation:
      type: object
      required: [id, userId, title, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Message:
      type: object
      description: 一条问答记录。grounded 标记回答当时是否有文档依据;残答不落此表。
      required: [id, conversationId, role, content, sequenceNumber, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
        conversationId:
          type: string
        role:
          $ref: "#/components/schemas/MessageRole"
        content:
          type: string
        sequenceNumber:
          type: integer
          minimum: 0
        grounded:
          type: boolean
          description: 该 assistant 回答是否命中文档依据;user 消息通常缺省。
        createdAt:
          type: string
          format: date-time

    # ---------- 分页 ----------
    ConversationPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        nextCursor:
          type: [string, "null"]
          description: 下一页游标;为 null 表示已到末页。
    MessagePage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextCursor:
          type: [string, "null"]
          description: 下一页游标;为 null 表示已到末页。

    # ---------- 问答请求 ----------
    ChatRequest:
      type: object
      description: >
        sessionId 是易失的上下文键(刷新即换),conversationId 是持久历史键。
        首次带某 sessionId 请求时后端新建 conversation,并在 done 事件回传其 conversationId。
      required: [knowledgeBaseId, sessionId, question]
      additionalProperties: false
      properties:
        knowledgeBaseId:
          type: string
          description: 检索只在此单库内,不跨库。
        sessionId:
          type: string
          description: 前端生成,标识一次浏览器会话;必须归属当前 user_id。
        question:
          type: string
          minLength: 1
        conversationId:
          type: string
          description: 可选;前端从上一轮 done 拿到后回传以显式复用会话。

    # ---------- SSE 事件(与 packages/shared/src/types/sse.ts 对齐) ----------
    SseEventType:
      type: string
      enum: [meta, token, error, done]
      description: SSE 事件类型,前端按 `event:` 分派。
    SseMetaEvent:
      type: object
      description: 首个事件,携带 grounded 命中状态与最高相似度。
      required: [type, grounded, topSimilarity]
      additionalProperties: false
      properties:
        type:
          type: string
          const: meta
        grounded:
          type: boolean
          description: false 表示最高相似度低于阈值,回答属常识推测(需求功能 3)。
        topSimilarity:
          type: number
          minimum: 0
          maximum: 1
    SseTokenEvent:
      type: object
      description: 逐字追加的回答内容。
      required: [type, delta]
      additionalProperties: false
      properties:
        type:
          type: string
          const: token
        delta:
          type: string
    SseErrorEvent:
      type: object
      description: 首字节发出后的流内错误,前端在已渲染内容后追加提示。
      required: [type, message]
      additionalProperties: false
      properties:
        type:
          type: string
          const: error
        message:
          type: string
    SseDoneEvent:
      type: object
      description: 正常收束,回传持久化的 conversationId。
      required: [type, conversationId]
      additionalProperties: false
      properties:
        type:
          type: string
          const: done
        conversationId:
          type: string
    SseEvent:
      description: 单个 SSE 事件的 data JSON,按 type 判别。
      oneOf:
        - $ref: "#/components/schemas/SseMetaEvent"
        - $ref: "#/components/schemas/SseTokenEvent"
        - $ref: "#/components/schemas/SseErrorEvent"
        - $ref: "#/components/schemas/SseDoneEvent"
      discriminator:
        propertyName: type
        mapping:
          meta: "#/components/schemas/SseMetaEvent"
          token: "#/components/schemas/SseTokenEvent"
          error: "#/components/schemas/SseErrorEvent"
          done: "#/components/schemas/SseDoneEvent"
